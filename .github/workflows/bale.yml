name: publish-gitops-artifact

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      CLUSTER_NAME: bale
      GITOPS_IMAGE: ghcr.io/${{ github.repository_owner }}/mono
    steps:
      - uses: actions/checkout@v4

      - name: Install Flux CLI
        uses: fluxcd/flux2/action@main

      - name: Login to GHCR
        run: |
          echo "${{ github.token }}" | docker login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

      - name: Push Flux OCI artifact
        run: |
          flux push artifact "oci://${GITOPS_IMAGE}:${CLUSTER_NAME}-${GITHUB_SHA::12}" \
            --path=. \
            --source="${{ github.server_url }}/${{ github.repository }}" \
            --revision="${GITHUB_SHA}"

          flux push artifact "oci://${GITOPS_IMAGE}:${CLUSTER_NAME}-main" \
            --path=. \
            --source="${{ github.server_url }}/${{ github.repository }}" \
            --revision="${GITHUB_SHA}"