apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

nameSuffix: -external
namespace: traefik-external

resources:
  - namespace.yaml
  - ../../base

configMapGenerator:
  - name: traefik-values
    files:
      - values.yaml=values.yaml

generatorOptions:
  disableNameSuffixHash: true

patches:
  - path: patches.yaml
