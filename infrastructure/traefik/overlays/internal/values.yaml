fullnameOverride: traefik-internal

ingressClass:
  enabled: true
  isDefaultClass: false
  name: traefik-internal

providers:
  kubernetesCRD:
    enabled: true
    ingressClass: traefik-internal
  kubernetesIngress:
    enabled: true
    ingressClass: traefik-internal
    publishedService:
      enabled: true

service:
  enabled: true
  single: true
  type: LoadBalancer
  spec:
    loadBalancerIP: ${TRAEFIK_INTERNAL_LB_IP}
    externalTrafficPolicy: Local

ports:
  web:
    port: 8000
    expose:
      default: true
    exposedPort: 80
    protocol: TCP
    redirections:
      entryPoint:
        to: websecure
        scheme: https
        permanent: true

  websecure:
    port: 8443
    expose:
      default: true
    exposedPort: 443
    protocol: TCP
    tls:
      enabled: true