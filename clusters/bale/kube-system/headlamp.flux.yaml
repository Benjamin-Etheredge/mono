apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: headlamp
  namespace: flux-system
spec:
  interval: 24h
  retryInterval: 2m
  timeout: 10m
  prune: true
  wait: true
  targetNamespace: kube-system
  sourceRef:
    kind: OCIRepository
    name: bale
  dependsOn:
    - name: traefik-internal

  path: ./infrastructure/headlamp
