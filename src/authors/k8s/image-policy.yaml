---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageRepository
metadata:
  name: authors
  namespace: authors
spec:
  image: docker.io/etheredgeb/authors
  interval: 5m
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImagePolicy
metadata:
  name: authors
  namespace: authors
spec:
  imageRepositoryRef:
    name: authors
    namespace: flux-system
  policy:
    semver:
      range: '>=1.0.0'
