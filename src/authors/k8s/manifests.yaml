apiVersion: apps/v1
kind: Deployment
metadata:
  name: authors
  namespace: authors
  labels:
    app: authors
spec:
  replicas: 1
  selector:
    matchLabels:
      app: authors
  template:
    metadata:
      labels:
        app: authors
    spec:
      containers:
        - name: authors
          image: docker.io/etheredgeb/authors:1.0.0 # {"$imagepolicy": "authors:authors"}
          ports:
            - containerPort: 8501
          env:
            - name: STREAMLIT_SERVER_PORT
              value: "8501"
            - name: STREAMLIT_SERVER_ADDRESS
              value: "0.0.0.0"
---
apiVersion: v1
kind: Service
metadata:
  name: authors
  namespace: authors
spec:
  selector:
    app: authors
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8501
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: authors
  namespace: authors
spec:
  ingressClassName: nginx
  rules:
    - host: authors.k8s.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: authors
                port:
                  number: 80
    - host: authors.etheredge.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: authors
                port:
                  number: 80
