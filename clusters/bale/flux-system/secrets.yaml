apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: bale-secrets
  namespace: flux-system
spec:
  interval: 10m
  timeout: 3m
  prune: true
  wait: true
  sourceRef:
    kind: OCIRepository
    name: bale
  path: ./infrastructure/secrets
  decryption:
    provider: sops
    secretRef:
      name: sops-age